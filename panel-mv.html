<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mother Verde · Panel</title>
<style>
  :root { --bg:#0f1712; --card:#17221b; --line:#2a3a2f; --text:#e8efe9; --muted:#9fb1a4; --ok:#5fbf7f; --bad:#e07a6b; --warn:#e2b35a; --btn:#2f6b45; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  h2 { font-size:17px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 14px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { background:var(--btn); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:#7a3328; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input, textarea { width:100%; background:#0b120e; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; }
  textarea { min-height:60px; }
  .tabs { display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap; }
  .tabs button { background:transparent; border:1px solid var(--line); }
  .tabs button.on { background:var(--btn); border-color:var(--btn); }
  .checks { list-style:none; padding:0; margin:8px 0; display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:4px 12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .mono { font-family:Consolas, Menlo, monospace; word-break:break-all; font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; }
  .msg { min-height:1.4em; margin:8px 0 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .scroll { overflow-x:auto; }
  a { color:#8fd3a6; }
  .qr { background:#fff; padding:8px; border-radius:8px; width:200px; }
  .qr img { width:184px; height:184px; display:block; }
</style>
</head>
<body>
<main>
  <h1>Mother Verde · Panel de administración</h1>
  <div id="app"><p class="muted">Cargando…</p></div>
</main>
<script type="module" src="/src/admin.js"></script>
</body>
</html>
